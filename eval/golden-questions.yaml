# Golden Questions: what the assistant should do with each question (#6, #12, #16).
#
# Schema (validated by backend/evaluation/golden.py):
#   id                       gq-<slug>, unique
#   question                 what the CSM types
#   category                 cross-article | version-conflict | table-lookup | near-duplicate |
#                            unanswerable | partial | follow-up
#   answerable               false -> a Refusal is expected, with no expected_sources or must_mention
#   origin                   curated (hand-designed, below) | generated (written with a generated Article)
#   expected_sources         [{article, section}]: the Article id and Section path the Answer should cite
#   expected_facts           human-readable notes on the expected Answer
#   must_mention             term groups; every group must be hit by any one of its terms,
#                            matched case-insensitively against the Answer
#   history                  follow-up only: earlier Turns as {question, answer}, with fixed answers
#   standalone_question      follow-up only: the ideal rewrite, used by the keyless retrieval eval
#   standalone_must_mention  follow-up only: term groups checked against the model's actual rewrite
#
# For partial questions, must_mention covers the answerable part; the gap statement is detected
# through the prompt module's canonical gap phrase.

# --- Seed set (#6) ----------------------------------------------------------------------------

- id: gq-scim-business-tier
  question: Can a Business-tier client set up SCIM provisioning with Okta?
  category: cross-article
  answerable: true
  origin: curated
  expected_sources:
    - { article: nimbus-plan-tiers, section: Feature matrix }
    - { article: nimbus-scim-provisioning, section: Prerequisites }
  expected_facts:
    - "No: SCIM provisioning requires the Enterprise tier."
    - SAML SSO must be configured first.
  must_mention:
    - [Enterprise]
    - [SSO, single sign-on, SAML]

- id: gq-entra-auto-deprovision
  question: >-
    An Enterprise client on Entra ID wants leavers removed automatically. What must be set up
    and what happens to their data?
  category: cross-article
  answerable: true
  origin: curated
  expected_sources:
    - { article: nimbus-sso-saml, section: Configuring Microsoft Entra ID }
    - { article: nimbus-scim-provisioning, section: Prerequisites }
    - { article: nimbus-scim-provisioning, section: Deprovisioning }
  expected_facts:
    - SAML SSO with Microsoft Entra ID first, then SCIM provisioning.
    - A deprovisioned user is suspended; their data is deleted after 30 days.
  must_mention:
    - [SCIM]
    - [SSO, single sign-on, SAML]
    - [suspend]
    - [30 days, 30-day, thirty days]

- id: gq-webhook-signature
  question: Which header carries the webhook signature and what algorithm is used?
  category: version-conflict
  answerable: true
  origin: curated
  expected_sources:
    - { article: nimbus-api-webhooks, section: Verifying signatures }
    - { article: nimbus-v2-legacy, section: Webhooks (v2) }
  expected_facts:
    - "v3: X-Nimbus-Signature-256, HMAC-SHA256."
    - "v2 note: X-Nimbus-Signature, HMAC-SHA1."
  must_mention:
    - [X-Nimbus-Signature-256]
    - [HMAC-SHA256]
    - [HMAC-SHA1]

