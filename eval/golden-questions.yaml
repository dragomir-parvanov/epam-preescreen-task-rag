# --- Follow-ups (#16) -------------------------------------------------------------------------

- id: gq-followup-webhook-signature-v2
  question: and on v2?
  category: follow-up
  answerable: true
  origin: curated
  history:
    - question: Which header carries the webhook signature and what algorithm is used?
      answer: >-
        Nimbus signs every webhook delivery with an HMAC-SHA256 of the raw request body and sends
        it in the X-Nimbus-Signature-256 header, as sha256= followed by the hex digest.
  standalone_question: Which header carries the webhook signature and what algorithm is used on v2?
  standalone_must_mention:
    - [v2]
  expected_sources:
    - { article: nimbus-v2-legacy, section: Webhooks (v2) }
  expected_facts:
    - "The Platform Version carries over: X-Nimbus-Signature, HMAC-SHA1."
  must_mention:
    - [X-Nimbus-Signature]
    - [HMAC-SHA1]

- id: gq-followup-rate-limit-enterprise
  question: what about Enterprise?
  category: follow-up
  answerable: true
  origin: curated
  history:
    - question: What is the API rate limit for a Business client?
      answer: >-
        A Business workspace can make 600 requests per minute across all of its API keys, with a
        burst allowance of 1,200 requests per minute for 10 seconds.
  standalone_question: What is the API rate limit for an Enterprise client?
  standalone_must_mention:
    - [Enterprise]
    - [rate limit]
  expected_sources:
    - { article: nimbus-api-webhooks, section: Rate limits }
  expected_facts:
    - "The Plan Tier switches: 3,000 req/min, bursting to 6,000 req/min for 10 s."
  must_mention:
    - ["3,000", "3000"]

