# Golden Questions: what the assistant should do with each question (#6, #12, #16).
#
# Schema (validated by backend/evaluation/golden.py):
#   id                       gq-<slug>, unique
#   question                 what the CSM types
#   category                 cross-article | version-conflict | table-lookup | near-duplicate |
#                            unanswerable | partial | follow-up | single-article (generated)
#   answerable               false -> a Refusal is expected, with no expected_sources or must_mention
#   origin                   curated (hand-designed, below) | generated (written with a generated Article)
#   expected_sources         [{article, section}]: the Article id and Section path the Answer should cite
#   expected_facts           human-readable notes on the expected Answer
#   must_mention             term groups; every group must be hit by any one of its terms,
#                            matched case-insensitively against the Answer
#   history                  follow-up only: earlier Turns as {question, answer}, with fixed answers
#   standalone_question      follow-up only: the ideal rewrite, used by the keyless retrieval eval
#   standalone_must_mention  follow-up only: term groups checked against the model's actual rewrite
#
# For partial questions, must_mention covers the answerable part; the gap statement is detected
# through the prompt module's canonical gap phrase.

