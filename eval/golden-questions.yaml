  answerable: true
  origin: curated
  expected_sources:
    - { article: nimbus-plan-tiers, section: Feature matrix }
    - { article: nimbus-scim-provisioning, section: Prerequisites }
  expected_facts:
    - "No: SCIM provisioning requires the Enterprise tier."
    - SAML SSO must be configured first.
  must_mention:
