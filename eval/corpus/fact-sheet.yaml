# Topics the Knowledge Base never covers. Mentioning any term is a violation in every Article.
forbidden_topics:
  - id: prices
    description: Prices, discounts, billing amounts or the cost of any Plan Tier or upgrade.
    terms: [price, prices, pricing, priced, discount, discounts, USD, EUR, GBP, "$", "€", "£", per seat per month]
  - id: ldap
    description: LDAP or Active Directory directory sync.
    terms: [LDAP, Active Directory, directory sync]
  - id: google-workspace
    description: Google Workspace as an identity provider, for SSO setup steps or provisioning.
    terms: [Google Workspace, G Suite, Google Cloud Identity, Google SSO]
  - id: webhook-ip-ranges
    description: The IP addresses or ranges webhooks are sent from, or allowlisting them.
    terms: [IP range, IP ranges, IP address, IP addresses, CIDR, allowlist, allowlisting, whitelist, source IP, egress IP]
  - id: other-identity-providers
    description: SSO or SCIM setup for any identity provider other than Okta and Microsoft Entra ID.
    terms: [OneLogin, Ping Identity, PingFederate, PingOne, JumpCloud, ADFS, AD FS, Auth0, Keycloak]
  - id: other-platform-versions
    description: Any Platform Version other than v2 and v3.
    terms: [v1, v4, Nimbus 1, Nimbus 4]
  - id: saml-single-logout
    description: SAML single logout (SLO).
    terms: [single logout, single log-out, SLO]
  - id: uptime-sla
    description: Uptime guarantees, SLAs or service credits.
    terms: [SLA, SLAs, uptime, service credit, service credits, "99.9"]
