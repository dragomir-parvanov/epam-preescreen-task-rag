# The planted-value conflict lint (#34): no generated Article may contradict a planted fact.
# Checked against every Article that isn't planted by backend/evaluation/corpus_lint_test.py, and by
# the generator before it writes an Article.
#
# A rule looks at each statement of an Article: a sentence of prose, a table row or a code line.
# It applies to Articles whose applies_to versions are all in `versions`. A statement it applies to
# is one that matches every `when` pattern (case-insensitive regexes). Then either:
#   value + allowed  every match of `value` must be one of `allowed` (compared ignoring case,
#                    spaces, hyphens and commas); an empty `allowed` forbids any match, or
#   requires         the statement must also match `requires`, e.g. a negation for a v2 absence.
# Rules are deliberately strict: a generated Article should link to the planted Article rather than
# restate its values, so a statement that trips a rule is rewritten, not the rule loosened.
conflict_rules:
  - id: scim-tier
    facts: [tier-scim, scim-requires-enterprise]
    versions: [v3]
    when: ['\bSCIM\b']
    value: '\b(?:Starter|Business)\b|\b(?:all|every|any)\s+(?:Plan\s+)?tiers?\b'
    allowed: []
  - id: scim-absent-on-v2
    facts: []
    versions: [v2]
    when: ['\bSCIM\b']
    requires: &negation '\b(?:no|not|never|without|none|isn''t|aren''t|doesn''t|don''t|can''t|cannot|unavailable)\b'
  - id: rate-limit-values
    facts: [api-rate-limits]
    versions: [v3]
    when: [&per_time '\breq(?:uests?)?\s*(?:/|per|a|an|each)\s*(?:s|sec|second|min|minute|h|hr|hour|day)\b']
    value: &rate_number '\b\d[\d,]*(?=\s*req(?:uests?)?\s*(?:/|per|a|an|each)\s*(?:s|sec|second|min|minute|h|hr|hour|day)\b)'
    allowed: ["600", "1,200", "3,000", "6,000"]
  - id: rate-limit-starter
    facts: [api-rate-limits, tier-api]
    versions: [v3]
    when: ['\bStarter\b', *per_time]
    value: *rate_number
    allowed: []
  - id: rate-limit-business
    facts: [api-rate-limits]
    versions: [v3]
    when: ['\bBusiness\b', *per_time]
    value: *rate_number
    allowed: ["600", "1,200"]
  - id: rate-limit-enterprise
    facts: [api-rate-limits]
    versions: [v3]
    when: ['\bEnterprise\b', *per_time]
    value: *rate_number
    allowed: ["3,000", "6,000"]
  - id: rate-limit-v2
    facts: [v2-rate-limit]
    versions: [v2]
    when: [*per_time]
    value: *rate_number
    allowed: ["300"]
  - id: burst
    facts: [api-rate-limits]
    versions: [v3]
    when: ['\bburst']
    value: '×\s*\d+|\b\d+\s*(?:x|×|times)(?!\w)|\b\d+[\s-]*(?:s|secs?|seconds?)\b'
    allowed: ["×2", "2x", "2×", "2 times", "10 s", "10 sec", "10 secs", "10 seconds", "10 second"]
  - id: burst-absent-on-v2
    facts: [v2-rate-limit]
    versions: [v2]
    when: ['\bburst']
    requires: *negation
  - id: webhook-signature-header
    facts: [webhook-signature]
    versions: [v3]
    when: ['X-Nimbus-Signature']
    value: 'X-Nimbus-Signature(?:-\w+)?'
    allowed: [X-Nimbus-Signature-256]
  - id: webhook-signature-header-v2
    facts: [v2-webhook-signature]
    versions: [v2]
    when: ['X-Nimbus-Signature']
    value: 'X-Nimbus-Signature(?:-\w+)?'
    allowed: [X-Nimbus-Signature]
  - id: webhook-signature-algorithm
    facts: [webhook-signature]
    versions: [v3]
    when: ['\bHMAC|\bsignature|\bsigned\b|\bsigning\b|\bsha\d']
    value: '\bSHA[\s-]*\d+'
    allowed: [SHA256, SHA-256]
  - id: webhook-signature-algorithm-v2
    facts: [v2-webhook-signature]
    versions: [v2]
    when: ['\bHMAC|\bsignature|\bsigned\b|\bsigning\b|\bsha\d']
    value: '\bSHA[\s-]*\d+'
    allowed: [SHA1, SHA-1]
  - id: saml-email-attribute
    facts: [sso-attribute-mapping]
    versions: [v3]
    when: ['\b(?:SAML|attributes?|assertions?|claims?)\b']
    value: '`e?mail`'
    allowed: ['`email`']
  - id: saml-email-attribute-v2
    facts: [v2-saml-email-attribute]
    versions: [v2]
    when: ['\b(?:SAML|attributes?|assertions?|claims?)\b']
    value: '`e?mail`'
    allowed: ['`mail`']
  - id: audit-log-retention
    facts: [tier-audit-retention]
    versions: [v2, v3]
    when: ['\baudit\b']
    value: &days '\b\d[\d,]*(?=[\s-]*days?\b)'
    allowed: ["30", "90", "365"]
  - id: audit-log-retention-starter
    facts: [tier-audit-retention]
    versions: [v3]
    when: ['\baudit\b', '\bStarter\b']
    value: *days
    allowed: ["30"]
  - id: audit-log-retention-business
    facts: [tier-audit-retention]
    versions: [v3]
    when: ['\baudit\b', '\bBusiness\b']
    value: *days
    allowed: ["90"]
  - id: audit-log-retention-enterprise
    facts: [tier-audit-retention]
    versions: [v3]
    when: ['\baudit\b', '\bEnterprise\b']
    value: *days
    allowed: ["365"]
  - id: auth-401-meaning
    facts: [sso-auth-401]
    versions: [v2, v3]
    when: ['\bAUTH-401\b']
    requires: '\bclock'
  - id: auth-403-meaning
    facts: [sso-auth-403]
    versions: [v2, v3]
    when: ['\bAUTH-403\b']
    requires: '\bassign'
  - id: auth-409-meaning
    facts: [sso-auth-409]
    versions: [v2, v3]
    when: ['\bAUTH-409\b']
    requires: '\bduplicate|\balready\b'
  - id: scim-sync-interval
    facts: [scim-sync-interval]
    versions: [v3]
    when: ['\bSCIM\b']
    value: '\b\d+[\s-]*(?:minutes?|mins?|hours?|hrs?|h)\b'
    allowed: ["40 minutes", "40 minute", "40 min", "40 mins"]
  - id: deprovisioned-data-retention
    facts: [scim-deprovisioning]
    versions: [v3]
    when: ['\b(?:deprovision|suspend|deactivat)\w*']
    value: *days
    allowed: ["30"]
  - id: apac-tier
    facts: [tier-regions]
    versions: [v3]
    when: ['\bAPAC\b']
    value: '\b(?:Starter|Business)\b|\b(?:all|every|any)\s+(?:Plan\s+)?tiers?\b'
    allowed: []
  - id: apac-absent-on-v2
    facts: []
    versions: [v2]
    when: ['\bAPAC\b']
    requires: *negation
  - id: rate-limit-headers-absent-on-v2
    facts: []
    versions: [v2]
    when: ['X-RateLimit']
    requires: *negation
  - id: webhook-auto-disable-absent-on-v2
    facts: []
    versions: [v2]
    when: ['auto-disabl\w*|disabled\s+automatically']
    requires: *negation
