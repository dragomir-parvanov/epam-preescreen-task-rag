services:
  # The Passage store (ADR-0004). The credentials are fixed, local-only and not secret: the
  # port is published on 127.0.0.1 only, so `pixi run dev-backend` and psql can reach it.
  postgres:
    image: ${POSTGRES_IMAGE:-pgvector/pgvector:0.8.6-pg18-trixie}
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
      POSTGRES_DB: rag
    volumes:
      - postgres-data:/var/lib/postgresql
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "--username", "rag", "--dbname", "rag"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 10s

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      # Overrides .env's host-side URL: inside Compose, Postgres is the `postgres` service.
      BACKEND_DATABASE_URL: postgresql://rag:rag@postgres:5432/rag
      # Haystack's anonymous usage telemetry stays off (the backend defaults it off too).
      HAYSTACK_TELEMETRY_ENABLED: "False"
      # No value: passed through from the shell (which wins over .env; unset stays unset), so the
      # container sees what `pixi run check-config` validated on the host.
      ANTHROPIC_API_KEY:
      BACKEND_LLM_PROVIDER:
      BACKEND_LLM_MODEL:
      BACKEND_OLLAMA_BASE_URL:
    ports:
      - "${BACKEND_HOST_PORT:-8000}:8000"
    volumes:
      # Read at startup: edit an Article, restart the backend, and the sync picks it up.
      - ./knowledge-base:/app/knowledge-base:ro
    # uvicorn gets 10 s (--timeout-graceful-shutdown) to finish in-flight Turns, then cancels them.
    stop_grace_period: 15s
    depends_on:
      postgres:
        condition: service_healthy
      # Only exists under the `ollama` profile; without it, Compose drops this dependency.
      ollama-pull:
        condition: service_completed_successfully
        required: false
    # Readiness, not liveness: healthy means the index is synced and the stack can answer, so
    # `up --wait` and the frontend's dependency wait for that. (Kubernetes would probe /health for
    # liveness and /ready for readiness separately; Compose has one healthcheck.) The start period
    # absorbs the first boot's embedding of every Passage.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')"]
      interval: 10s
      timeout: 10s
      retries: 3
      start_period: 300s
      start_interval: 2s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "${FRONTEND_HOST_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy

  # Keyless local LLM, on only with COMPOSE_PROFILES=ollama, so Claude users never pull the image.
  ollama:
    image: &ollama-image ollama/ollama:0.40.8
    profiles: [ollama]
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # One-shot: pulls the model into the volume before the backend starts; a quick no-op once pulled.
  # Follow the first ~2.7 GB download with `docker compose logs -f ollama-pull`.
  ollama-pull:
    image: *ollama-image
    profiles: [ollama]
    environment:
      OLLAMA_HOST: http://ollama:11434
    command: ["pull", "${BACKEND_LLM_MODEL:-qwen3.5:2b}"]
    depends_on:
      ollama:
        condition: service_healthy

volumes:
  postgres-data:
  # Survives `pixi run down`; only `docker compose down -v` deletes the downloaded models.
  ollama-models:
