# The image's default "main" format plus the id, to join an nginx line to the backend's lines.
# Here, outside `server`, because this file is included in nginx.conf's `http` block.
log_format with_request_id '$remote_addr - $remote_user [$time_local] "$request" '
                           '$status $body_bytes_sent "$http_referer" '
                           '"$http_user_agent" request_id=$request_id';

server {
    listen 80;
    root /usr/share/nginx/html;

    # A coarse backstop; the backend validates the real request caps.
    client_max_body_size 256k;

    # Every /api request carries nginx's own id to the backend, which logs it on every line,
    # echoes it in X-Request-ID and puts it in error envelopes. nginx's access log has it too.
    access_log /var/log/nginx/access.log with_request_id;

    # /api/* is the backend with the prefix stripped, same as the Vite dev proxy.
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header X-Request-ID $request_id;
    }

    # The chat stream: pass each SSE event on as it arrives instead of buffering the response.
    location = /api/chat {
        proxy_pass http://backend:8000/chat;
        proxy_set_header X-Request-ID $request_id;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        # Above the backend's own Turn deadline, so the backend always ends the stream first.
        proxy_read_timeout 300s;
    }

    location / {
        try_files $uri /index.html;
    }
}
