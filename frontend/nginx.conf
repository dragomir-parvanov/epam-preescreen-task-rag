server {
    listen 80;
    root /usr/share/nginx/html;

    # A coarse backstop; the backend validates the real request caps.
    client_max_body_size 256k;

    # /api/* is the backend with the prefix stripped, same as the Vite dev proxy.
    location /api/ {
        proxy_pass http://backend:8000/;
    }

    # The chat stream: pass each SSE event on as it arrives instead of buffering the response.
    location = /api/chat {
        proxy_pass http://backend:8000/chat;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        # Above the backend's own Turn deadline, so the backend always ends the stream first.
        proxy_read_timeout 300s;
    }

    location / {
        try_files $uri /index.html;
    }
}
