[workspace]
name = "epam-preescreen-task-rag"
channels = ["conda-forge"]
platforms = ["linux-64", "linux-aarch64", "osx-arm64", "win-64"]

# --- backend: runtime only, also what the backend Docker image installs ---

[feature.backend.dependencies]
python = "3.13.*"

[feature.backend.pypi-dependencies]
fastapi = ">=0.115"
pydantic-settings = ">=2.6"
# JSON logs in the image, a console renderer in dev-backend (BACKEND_LOG_FORMAT).
structlog = "==26.1.0"
uvicorn = { version = ">=0.32", extras = ["standard"] }
# Haystack 3.x and its integrations, exact-pinned (ADR-0003): only app/rag/haystack imports them.
haystack-ai = "==3.4.1"
pgvector-haystack = "==8.1.2"
fastembed-haystack = "==3.0.0"
fastembed = "==0.9.0"
# The Postgres driver pgvector-haystack uses; the test fixture uses it too.
psycopg = { version = "==3.3.6", extras = ["binary"] }
# Article front-matter.
pyyaml = ">=6.0"
# Each generator integration with the provider SDK it was tested against (#22).
anthropic-haystack = "==8.0.1"
anthropic = "==2.1.0"
ollama-haystack = "==7.0.2"
ollama = "==0.6.3"

# --- backend dev tooling ---

[feature.backend-dev.dependencies]
pyright = "*"
pytest = "*"
pyyaml = "*"
ruff = "*"

[feature.backend-dev.pypi-dependencies]
httpx2 = "*"
# A real pgvector for the adapter tests (ADR-0004).
testcontainers = "==4.15.0"

# --- frontend: Node comes from conda-forge, npm manages the JS packages ---

[feature.frontend.dependencies]
nodejs = "22.*"

[feature.frontend.tasks]
npm-install = { cmd = "npm ci", cwd = "frontend", inputs = ["frontend/package-lock.json"], outputs = ["frontend/node_modules/.package-lock.json"] }

[environments]
default = ["backend", "backend-dev", "frontend"]
backend = { features = ["backend"], no-default-feature = true }
frontend = { features = ["frontend"], no-default-feature = true }

[tasks]
# Stack
# --wait returns once the backend's /ready passes: the index is synced and the stack can answer.
# The timeout leaves room for the first Ollama model download.
up = { cmd = "echo 'First keyless run (COMPOSE_PROFILES=ollama)? It downloads ~8 GB; follow the model with: docker compose logs -f ollama-pull' && docker compose up --build --detach --wait --wait-timeout 1800", depends-on = ["check-config"] }
# Never -v: that would also delete the downloaded Ollama models.
down = "docker compose down"
# Sync the Passage index with knowledge-base/ once, in the backend image (safe while it runs).
ingest = { cmd = "docker compose run --rm backend python -m app.ingest", depends-on = ["check-config"] }
# Drop and rebuild the index, with the backend stopped so nothing reads a half-built table.
reindex = { cmd = "docker compose stop backend && docker compose run --rm backend python -m app.ingest --rebuild && docker compose up --detach --wait --wait-timeout 600 backend", depends-on = ["check-config"] }
# The CI smoke job, also runnable locally: the real stack on the keyless `fake` LLM provider, as
# its own Compose project on its own ports, checked through nginx, then removed with its volume.
smoke = { cmd = "python -m smoke.compose_smoke", cwd = "backend" }
# Validates .env with the backend's own Settings, so a missing key fails before any Docker build.
check-config = { cmd = "python -m app.check_config", cwd = "backend" }

# Local dev servers (the Vite dev server proxies /api to the backend)
dev-backend = { cmd = "uvicorn --factory app.main:create_app_from_env --reload --port 8000", cwd = "backend", env = { BACKEND_LOG_FORMAT = "console" } }
dev-frontend = { cmd = "npm run dev", cwd = "frontend", depends-on = ["npm-install"] }

# Lint
lint-backend = { cmd = "ruff check . && ruff format --check .", cwd = "backend" }
lint-frontend = { cmd = "npm run check", cwd = "frontend", depends-on = ["npm-install"] }
lint = { depends-on = ["lint-backend", "lint-frontend"] }

# Typecheck
typecheck-backend = { cmd = "pyright", cwd = "backend" }
typecheck-frontend = { cmd = "npm run typecheck", cwd = "frontend", depends-on = ["npm-install"] }
typecheck = { depends-on = ["typecheck-backend", "typecheck-frontend"] }

# Test
test-backend = { cmd = "pytest", cwd = "backend" }
test-frontend = { cmd = "npm test", cwd = "frontend", depends-on = ["npm-install"] }
test = { depends-on = ["test-backend", "test-frontend"] }

# The keyless retrieval eval (#28), which CI gates on: the real embedder over the whole Knowledge
# Base in a throwaway pgvector (needs Docker), recall@k and the gate checked for every Golden
# Question. k and min_score come from Settings (BACKEND_RETRIEVAL_TOP_K, BACKEND_RETRIEVAL_MIN_SCORE).
eval-retrieval = { cmd = "python -m evaluation.eval_retrieval", cwd = "backend" }

# The full LLM eval (#29): opt-in, and never in CI. The 27 curated Golden Questions (`--all` for
# every one) through the real ChatService and the configured LLM (.env), over a throwaway
# pgvector (needs Docker). Writes eval/results/<provider>-<model>-<prompt version>-<set>.md/.json.
eval = { cmd = "python -m evaluation.eval_llm", cwd = "backend" }

# OpenAPI -> TypeScript. The schema is committed so API changes show up in review.
gen-openapi = { cmd = "python -m app.export_openapi ../frontend/src/api/openapi.json", cwd = "backend" }
gen-types = { cmd = "npm run gen-types", cwd = "frontend", depends-on = ["gen-openapi", "npm-install"] }
check-types-fresh = { cmd = "git diff --exit-code -- frontend/src/api/openapi.json frontend/src/api/schema.d.ts", depends-on = ["gen-types"] }

# The generated Knowledge Base Articles (#34), run by hand: `generate-corpus run` calls Claude with
# ANTHROPIC_API_KEY. CI, startup and ingestion only read the committed Articles.
generate-corpus = { cmd = "python -m evaluation.generate_corpus", cwd = "backend" }
