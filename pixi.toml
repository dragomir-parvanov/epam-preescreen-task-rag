[workspace]
name = "epam-preescreen-task-rag"
channels = ["conda-forge"]
platforms = ["linux-64", "linux-aarch64", "osx-arm64", "win-64"]

# --- backend: runtime only, also what the backend Docker image installs ---

[feature.backend.dependencies]
python = "3.13.*"

[feature.backend.pypi-dependencies]
fastapi = ">=0.115"
pydantic-settings = ">=2.6"
uvicorn = { version = ">=0.32", extras = ["standard"] }

# --- backend dev tooling ---

[feature.backend-dev.dependencies]
pyright = "*"
pytest = "*"
ruff = "*"

[feature.backend-dev.pypi-dependencies]
httpx2 = "*"

# --- frontend: Node comes from conda-forge, npm manages the JS packages ---

[feature.frontend.dependencies]
nodejs = "22.*"

[feature.frontend.tasks]
npm-install = { cmd = "npm ci", cwd = "frontend", inputs = ["frontend/package-lock.json"], outputs = ["frontend/node_modules/.package-lock.json"] }

[environments]
default = ["backend", "backend-dev", "frontend"]
backend = { features = ["backend"], no-default-feature = true }
frontend = { features = ["frontend"], no-default-feature = true }

[tasks]
# Stack
up = "docker compose up --build --detach --wait"
down = "docker compose down"

# Local dev servers (the Vite dev server proxies /api to the backend)
dev-backend = { cmd = "uvicorn app.main:app --reload --port 8000", cwd = "backend" }
dev-frontend = { cmd = "npm run dev", cwd = "frontend", depends-on = ["npm-install"] }

# Lint
lint-backend = { cmd = "ruff check . && ruff format --check .", cwd = "backend" }
lint-frontend = { cmd = "npm run lint", cwd = "frontend", depends-on = ["npm-install"] }
lint = { depends-on = ["lint-backend", "lint-frontend"] }

# Typecheck
typecheck-backend = { cmd = "pyright", cwd = "backend" }
typecheck-frontend = { cmd = "npm run typecheck", cwd = "frontend", depends-on = ["npm-install"] }
typecheck = { depends-on = ["typecheck-backend", "typecheck-frontend"] }

# Test
test-backend = { cmd = "pytest", cwd = "backend" }
test-frontend = { cmd = "npm test", cwd = "frontend", depends-on = ["npm-install"] }
test = { depends-on = ["test-backend", "test-frontend"] }

# OpenAPI -> TypeScript. The schema is committed so API changes show up in review.
gen-openapi = { cmd = "python -m app.export_openapi ../frontend/src/api/openapi.json", cwd = "backend" }
gen-types = { cmd = "npm run gen-types", cwd = "frontend", depends-on = ["gen-openapi", "npm-install"] }
check-types-fresh = { cmd = "git diff --exit-code -- frontend/src/api/openapi.json frontend/src/api/schema.d.ts", depends-on = ["gen-types"] }
