# Tool configuration only: dependencies live in the root pixi.toml.
[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.13"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.13"

[tool.pytest.ini_options]
testpaths = ["app"]
addopts = ["--strict-markers"]
markers = [
    "pgvector: needs Docker for a real pgvector (ADR-0004); deselect with -m 'not pgvector'",
]
